<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>404 · RhythmFM Latino</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

:root{--pink:#ff2b9a;--cyan:#28d9ff;--text:#f7f0f8;--muted:#b9a9bd}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;
  color:var(--text);font-family:Inter,system-ui,sans-serif;
  background:
    radial-gradient(circle at 18% 25%,rgba(255,43,154,.2),transparent 30%),
    radial-gradient(circle at 82% 72%,rgba(40,217,255,.15),transparent 30%),
    linear-gradient(135deg,#08030e,#12051b 48%,#05070d)
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;
  background:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
             linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);
  background-size:42px 42px
}
.card{
  position:relative;isolation:isolate;width:min(900px,calc(100% - 32px));
  padding:58px 42px 48px;text-align:center;
  border:1px solid rgba(255,255,255,.13);border-radius:30px;
  background:rgba(20,8,28,.84);backdrop-filter:blur(18px);
  box-shadow:0 0 70px rgba(255,43,154,.12),inset 0 0 50px rgba(40,217,255,.035)
}
.logo{
  width:82px;height:82px;object-fit:contain;border-radius:50%;padding:7px;
  background:#f5e9e2;border:1px solid rgba(255,255,255,.3);
  box-shadow:0 0 18px rgba(255,43,154,.5),0 0 42px rgba(40,217,255,.12)
}
.eyebrow{margin:22px 0 8px;font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan)}
h1{
  margin:0;font-size:clamp(86px,18vw,170px);line-height:.82;font-weight:800;letter-spacing:-.07em;
  color:#fff;animation:neonBreathe 2.8s ease-in-out infinite;
  text-shadow:0 0 8px rgba(255,255,255,.4),0 0 25px rgba(255,43,154,.55),0 0 55px rgba(255,43,154,.25)
}
h1 span{color:var(--pink)}
h2{margin:26px 0 10px;font-size:clamp(23px,4vw,37px)}
p{max-width:610px;margin:0 auto;color:var(--muted);line-height:1.7;font-size:15px}
.count{
  margin-top:18px;font-size:12px;letter-spacing:.1em;color:rgba(255,255,255,.48)
}
.buttons{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:28px}
a{
  display:inline-flex;align-items:center;justify-content:center;min-width:175px;
  padding:14px 22px;border-radius:999px;color:#fff;text-decoration:none;font-weight:700;
  border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.045);transition:.2s
}
a:hover{transform:translateY(-2px);border-color:rgba(40,217,255,.55);box-shadow:0 0 25px rgba(40,217,255,.15)}
a.primary{border:0;color:#09030b;background:linear-gradient(90deg,var(--pink),#ff4e72);box-shadow:0 0 28px rgba(255,43,154,.28)}
.frequency{margin-top:28px;font-size:10px;letter-spacing:.18em;color:rgba(255,255,255,.34);text-transform:uppercase}
.waves{display:flex;align-items:end;justify-content:center;gap:5px;height:25px;margin:0 auto 8px}
.waves i{width:4px;height:9px;border-radius:4px;background:var(--pink);box-shadow:0 0 9px var(--pink);animation:pulse 1s ease-in-out infinite alternate}
.waves i:nth-child(2){height:18px;animation-delay:.12s;background:var(--cyan);box-shadow:0 0 9px var(--cyan)}
.waves i:nth-child(3){height:13px;animation-delay:.22s}
.waves i:nth-child(4){height:22px;animation-delay:.34s;background:var(--cyan);box-shadow:0 0 9px var(--cyan)}
.waves i:nth-child(5){height:11px;animation-delay:.45s}

.neon-orbit{
  position:absolute;inset:50% auto auto 50%;width:min(620px,82vw);height:min(620px,82vw);
  transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;z-index:-1;
  animation:orbit 18s linear infinite
}
.neon-orbit:before,.neon-orbit:after{
  content:"";position:absolute;inset:0;border-radius:50%;
  border:1px solid rgba(255,43,154,.18);
  box-shadow:0 0 18px rgba(255,43,154,.16),inset 0 0 25px rgba(40,217,255,.08)
}
.neon-orbit:after{
  inset:10%;border-color:rgba(40,217,255,.13);
  box-shadow:0 0 22px rgba(40,217,255,.14),inset 0 0 30px rgba(255,43,154,.08);
  animation:orbitReverse 11s linear infinite
}
.neon-sweep{
  position:absolute;top:50%;left:50%;width:48%;height:2px;transform-origin:left center;
  background:linear-gradient(90deg,transparent,rgba(40,217,255,.8),rgba(255,43,154,.95));
  box-shadow:0 0 12px rgba(255,43,154,.7),0 0 25px rgba(40,217,255,.4);
  animation:sweep 6s linear infinite
}
.progress{
  width:min(360px,80%);height:3px;margin:15px auto 0;border-radius:99px;
  background:rgba(255,255,255,.08);overflow:hidden
}
.progress span{
  display:block;width:100%;height:100%;transform-origin:left;
  background:linear-gradient(90deg,var(--cyan),var(--pink));
  box-shadow:0 0 10px var(--pink);animation:redirect 2.2s linear forwards
}
@keyframes pulse{to{transform:scaleY(.55);opacity:.65}}
@keyframes orbit{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes orbitReverse{to{transform:rotate(-360deg)}}
@keyframes sweep{to{transform:rotate(360deg)}}
@keyframes neonBreathe{
  0%,100%{transform:scale(1);filter:brightness(1)}
  45%{transform:scale(1.012);filter:brightness(1.13)}
  50%{transform:scale(.998);filter:brightness(.95)}
  55%{transform:scale(1.008);filter:brightness(1.08)}
}
@keyframes redirect{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@media(max-width:600px){.card{padding:42px 22px 36px;border-radius:22px}.logo{width:68px;height:68px}}
</style>
</head>

<body>
<main class="card">
  <div class="neon-orbit" aria-hidden="true"><div class="neon-sweep"></div></div>

  <img class="logo" src="/logo.png" alt="RhythmFM Latino">

  <div class="eyebrow" id="eyebrow">RhythmFM Latino · Señal digital</div>
  <h1>4<span>0</span>4</h1>
  <h2 id="title">Esta frecuencia no existe.</h2>
  <p id="message">La página que buscas salió del aire. Te estamos llevando de vuelta a la frecuencia principal.</p>

  <div class="count" id="count">Volviendo al Home…</div>
  <div class="progress" aria-hidden="true"><span></span></div>

  <div class="buttons">
    <a class="primary" id="homeLink" href="https://www.mygochez.com/">Volver al Home</a>
    <a id="radioLink" href="https://radio.mygochez.com/">Escuchar RFM</a>
  </div>

  <div class="frequency">
    <div class="waves" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <span id="footer">Tu ritmo · Tu radio · 24/7</span>
  </div>
</main>

<script>
(function () {
  const translations = {
    es: {
      eyebrow: "RhythmFM Latino · Señal digital",
      title: "Esta frecuencia no existe.",
      message: "La página que buscas salió del aire. Te estamos llevando de vuelta a la frecuencia principal.",
      count: "Volviendo al Home…",
      home: "Volver al Home",
      radio: "Escuchar RFM",
      footer: "Tu ritmo · Tu radio · 24/7"
    },
    en: {
      eyebrow: "RhythmFM Latino · Digital signal",
      title: "This frequency doesn't exist.",
      message: "The page you're looking for went off the air. We're taking you back to the main frequency.",
      count: "Returning to Home…",
      home: "Back to Home",
      radio: "Listen to RFM",
      footer: "Your rhythm · Your radio · 24/7"
    },
    pt: {
      eyebrow: "RhythmFM Latino · Sinal digital",
      title: "Esta frequência não existe.",
      message: "A página que você procura saiu do ar. Estamos levando você de volta à frequência principal.",
      count: "Voltando ao início…",
      home: "Voltar ao início",
      radio: "Ouvir a RFM",
      footer: "Seu ritmo · Sua rádio · 24/7"
    }
  };

  // Prefer the site's saved language; otherwise use the browser language.
  let lang = null;
  try {
    const saved = localStorage.getItem("rfm-language") ||
                  localStorage.getItem("rfmLang") ||
                  localStorage.getItem("language");
    if (saved) {
      if (/^(pt|pt-br)/i.test(saved)) lang = "pt";
      else if (/^en/i.test(saved)) lang = "en";
      else if (/^es/i.test(saved)) lang = "es";
    }
  } catch (e) {}

  if (!lang) {
    const browser = (navigator.language || "es").toLowerCase();
    lang = browser.startsWith("pt") ? "pt" : browser.startsWith("en") ? "en" : "es";
  }

  const t = translations[lang];
  document.documentElement.lang = lang;
  document.getElementById("eyebrow").textContent = t.eyebrow;
  document.getElementById("title").textContent = t.title;
  document.getElementById("message").textContent = t.message;
  document.getElementById("count").textContent = t.count;
  document.getElementById("homeLink").textContent = t.home;
  document.getElementById("radioLink").textContent = t.radio;
  document.getElementById("footer").textContent = t.footer;

  // GitHub Pages serves this 404 page for unknown paths.
  // Briefly show the RFM ident, then automatically return to the Home.
  const home = new URL("/", window.location.origin).href;
  setTimeout(function () {
    window.location.replace(home);
  }, 2200);
})();
</script>
</body>
</html>
